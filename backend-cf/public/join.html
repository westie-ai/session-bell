<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SessionBell 接入</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 560px;
         margin: 8vh auto; padding: 0 20px; line-height: 1.7;
         background: light-dark(#FAF9F5, #1a1a18); color: light-dark(#3D3929, #E8E6DC); }
  h1 { font-size: 1.5em; } .bell { color: #D97757; }
  input, button { font-size: 1em; padding: 10px 14px; border-radius: 10px;
                  border: 1px solid light-dark(#ccc, #444); }
  input { width: 60%; background: light-dark(#fff, #262624); color: inherit; }
  button { background: #D97757; color: #fff; border: none; cursor: pointer; }
  button:hover { filter: brightness(1.06); }
  .step { margin: 1.2em 0; padding: 14px 18px; border-radius: 14px;
          background: light-dark(#f0eee6, #262624); }
  code { word-break: break-all; font-size: .85em;
         background: light-dark(#e6e3d8, #333); padding: 2px 6px; border-radius: 6px; }
  #result { display: none; }
  a.dl { display: inline-block; background: #D97757; color: #fff; padding: 10px 18px;
         border-radius: 10px; text-decoration: none; margin-top: 6px; }
  .copy { font-size: .8em; margin-left: 8px; background: light-dark(#e6e3d8,#3a3a37);
          color: inherit; padding: 4px 10px; }
</style>
</head>
<body>
<h1><span class="bell">🔔</span> SessionBell 接入</h1>
<p>把 Agent 装进锁屏:任务通知、实时面板、手机批准与遥控。</p>

<div id="gate" class="step">
  <b>输入邀请码</b><br><br>
  <input id="invite" placeholder="邀请码" autocomplete="off">
  <button onclick="join()">生成我的接入包</button>
  <div id="err" style="color:#c0392b"></div>
</div>

<div id="result">
  <div class="step"><b>① 手机装 App</b><br>
    App Store 装「TestFlight」,然后点
    <a href="https://testflight.apple.com/join/JhgVd9pZ">加入 SessionBell 测试</a>,安装。</div>
  <div class="step"><b>② App 里粘配对码</b><br>
    打开 App → 本机 → 后端配置 → 粘贴:<br><br>
    <code id="code"></code><button class="copy" onclick="copyCode()">复制</button></div>
  <div class="step"><b>③ Mac 装安装包</b><br>
    下载并双击安装(已签名公证,系统不会拦):<br>
    <a class="dl" href="/SessionBell.pkg">⬇︎ 下载 SessionBell.pkg</a><br><br>
    装完在终端里粘这行完成配对:<br><br>
    <code id="paircmd"></code><button class="copy" onclick="copyPair()">复制</button></div>
  <p style="font-size:.85em; opacity:.7">配对码等同密码,请勿转发给他人。</p>
</div>

<script>
async function join() {
  const invite = document.getElementById('invite').value.trim();
  const r = await fetch('/api/signup', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ invite }),
  });
  if (!r.ok) { document.getElementById('err').textContent = '邀请码不对'; return; }
  const d = await r.json();
  document.getElementById('code').textContent = d.pairing_code;
  document.getElementById('paircmd').textContent = 'sessionbell pair ' + d.pairing_code;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('result').style.display = 'block';
}
function copyCode() { navigator.clipboard.writeText(document.getElementById('code').textContent); }
function copyPair() { navigator.clipboard.writeText(document.getElementById('paircmd').textContent); }
document.getElementById('invite').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
</script>
</body>
</html>
