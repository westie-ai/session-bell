name: SessionBell
options:
  deploymentTarget:
    iOS: "17.2"
targets:
  SessionBell:
    type: application
    platform: iOS
    sources:
      - SessionBell
      - Shared
    dependencies:
      - target: SessionBellWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuesun.SessionBell
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 27Z3Z38H3M
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "6"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: SessionBell
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SessionBell/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSLocalNetworkUsageDescription: Sends the Live Activity push token back to a Mac on your local network so it can clear the waiting state on the Lock Screen.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: SessionBell/SessionBell.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
  SessionBellScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Screenshots
    dependencies:
      - target: SessionBell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuesun.SessionBell.Screenshots
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 27Z3Z38H3M
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: SessionBell
        GENERATE_INFOPLIST_FILE: YES
  SessionBellWidgets:
    type: app-extension
    platform: iOS
    sources:
      - SessionBellWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuesun.SessionBell.Widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 27Z3Z38H3M
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "6"
        SKIP_INSTALL: true
    info:
      path: SessionBellWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: SessionBell
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  SessionBell:
    build:
      targets:
        SessionBell: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SessionBellScreenshots
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
