name: SessionBell
options:
  deploymentTarget:
    iOS: "17.2"
targets:
  SessionBell:
    type: application
    platform: iOS
    sources:
      - SessionBell
      - Shared
    dependencies:
      - target: SessionBellWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuesun.SessionBell
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 27Z3Z38H3M
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: SessionBell
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SessionBell/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSLocalNetworkUsageDescription: 把 Live Activity 推送令牌回传给局域网内的 Mac，用于结束锁屏上的等待状态。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: SessionBell/SessionBell.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
  SessionBellWidgets:
    type: app-extension
    platform: iOS
    sources:
      - SessionBellWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yuesun.SessionBell.Widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 27Z3Z38H3M
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        SKIP_INSTALL: true
    info:
      path: SessionBellWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: SessionBell
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
