name: windows-exe

on:
  workflow_dispatch:
  push:
    tags: ["win-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sessionbell.exe
        run: |
          pip install pyinstaller tzdata
          pyinstaller --onefile --name sessionbell windows/sessionbell_runner.py

      - name: Smoke test
        run: |
          ./dist/sessionbell.exe help
          ./dist/sessionbell.exe status
          ./dist/sessionbell.exe doctor

      - name: E2E pair against production backend
        run: |
          # 一次性测试租户:命名空间由密钥哈希派生,固定测试密钥 = 固定的
          # 垃圾桶命名空间,不碰任何真实用户/demo 数据。
          $code = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('{"u":"https://sessionbell.westie.ai","s":"sb-ci-e2e-throwaway"}'))
          ./dist/sessionbell.exe pair $code
          Write-Host "pair exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { Write-Error "pair crashed or failed"; exit 1 }
          if (!(Test-Path "$env:USERPROFILE\.sessionbell\config.json")) { Write-Error "config.json missing"; exit 1 }
          if (!(Test-Path "$env:USERPROFILE\.sessionbell\sessionbell_hook.py")) { Write-Error "hook missing"; exit 1 }
          $s = Get-Content "$env:USERPROFILE\.claude\settings.json" -Raw
          if ($s -notmatch "sessionbell") { Write-Error "hooks not wired"; exit 1 }
          schtasks /Query /TN "SessionBell Relay"
          if ($LASTEXITCODE -ne 0) { Write-Error "autostart task missing"; exit 1 }
          Start-Sleep 6
          ./dist/sessionbell.exe doctor

          # relay 前台起一份,抓它的报错与健康检查
          $p = Start-Process -FilePath ./dist/sessionbell.exe -ArgumentList "relay" -RedirectStandardError relay-err.txt -RedirectStandardOutput relay-out.txt -PassThru -NoNewWindow
          Start-Sleep 8
          $health = "FAIL"
          try { $health = (Invoke-WebRequest http://127.0.0.1:48765/health -UseBasicParsing -TimeoutSec 5).StatusCode } catch {}
          Write-Host "relay health: $health  exited: $($p.HasExited)"
          Get-Content relay-err.txt, relay-out.txt -ErrorAction SilentlyContinue
          if ("$health" -ne "200") { Write-Error "relay unhealthy"; exit 1 }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: sessionbell-windows
          path: dist/sessionbell.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/win-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --title "Windows ${{ github.ref_name }}" --notes "SessionBell Windows 客户端(sessionbell.exe)" dist/sessionbell.exe backend-cf/public/sessionbell_hook.py 2>$null
          if ($LASTEXITCODE -ne 0) { gh release upload "${{ github.ref_name }}" dist/sessionbell.exe backend-cf/public/sessionbell_hook.py --clobber }
